{% extends plantilla_base %}

{% block titulo %}{{ titulo|title }} · VIVA SOCCER{% endblock %}

{% block contenido %}
<div class="fixed inset-0 z-[60] flex items-center justify-center overflow-y-auto bg-bg-base/80 p-6"
     onclick="if (event.target === this) this.remove()">
  <div class="relative w-full max-w-lg overflow-hidden rounded-xl border border-border bg-bg-surface p-8">
    <div class="absolute inset-x-0 top-0 h-1 bg-accent"></div>

    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="seccion-kicker">Tutores / Formulario</p>
        <h2 class="titulo mt-1 text-2xl">{{ titulo }}</h2>
      </div>
      <button type="button" class="flex h-8 w-8 items-center justify-center rounded-lg border border-border text-text-muted hover:text-text-primary"
              onclick="document.getElementById('modal').innerHTML=''">✕</button>
    </div>

    <form hx-post="{{ accion }}" hx-target="#modal" class="mt-6">
      {% csrf_token %}
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="flex flex-col gap-2 sm:col-span-2">
          <span class="etiqueta">Nombre completo</span>
          {{ form.nombre }}
          {% for e in form.nombre.errors %}<span class="text-xs text-danger">{{ e }}</span>{% endfor %}
        </label>

        <label class="flex flex-col gap-2">
          <span class="etiqueta">Teléfono</span>
          {{ form.telefono }}
          <span class="text-xs text-text-muted">Formato: 55 1234 5678.</span>
          {% for e in form.telefono.errors %}<span class="text-xs text-danger">{{ e }}</span>{% endfor %}
        </label>

        <label class="flex flex-col gap-2">
          <span class="etiqueta">Correo</span>
          {{ form.correo }}
          {% for e in form.correo.errors %}<span class="text-xs text-danger">{{ e }}</span>{% endfor %}
        </label>
      </div>

      <div class="mt-8 flex justify-end gap-3">
        <button type="button" class="btn-fantasma" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
        <button type="submit" class="btn-primario h-11 text-base">GUARDAR</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
